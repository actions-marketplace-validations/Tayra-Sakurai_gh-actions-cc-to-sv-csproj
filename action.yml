name: Conventional Commits to .csproj package version
description: Converts a commit in Conventional Commits standard into .csproj file package version.

inputs:
  tag:
    description: The base tag
    required: false
  path:
    description: The paths for project files separated by newline
    required: true

outputs:
  release-type:
    description: The release type

runs:
  using: node24
  main: dist/index.js
